<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MeldMail desktop interface — Light and Dark</title><desc id="desc">A compact three-pane personal email client with navigation, unified inbox and reading pane in Light and Dark themes.</desc>
<defs>
 <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#149CF5"/><stop offset=".5" stop-color="#0876F2"/><stop offset=".8" stop-color="#078EDB"/><stop offset="1" stop-color="#31C66B"/></linearGradient>
 <style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
 .muted{font-size:11px;fill:#8490a0}.small{font-size:12px}.tiny{font-size:10px}
 .title{font-size:18px;font-weight:700}.sender{font-size:12px;font-weight:650}.subject{font-size:12px;font-weight:600}.snippet{font-size:10px}
 .light .surface{fill:#fff}.light .side{fill:#f7f9fc}.light .line{stroke:#e8edf3}.light .main{fill:#172033}.light .muted{fill:#8792a2}.light .row-selected{fill:#eaf2ff}.light .blue{fill:#1677f2}.light .pill{fill:#edf4ff}
 .dark .surface{fill:#171c26}.dark .side{fill:#141923}.dark .line{stroke:#2b3442}.dark .main{fill:#e9eef6}.dark .muted{fill:#97a3b4}.dark .row-selected{fill:#1e3c68}.dark .blue{fill:#3488ff}.dark .pill{fill:#263b59}
 </style>
</defs>
