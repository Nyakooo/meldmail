# Optional Linux host proxy access. deploy.sh selects this when a port is configured.
services:
  meldmail:
    network_mode: host
    ports: !reset []
    environment:
      - MELDMAIL_ADDR=127.0.0.1:${MELDMAIL_HTTP_PORT:-18085}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${MELDMAIL_HTTP_PORT:-18085}/"]
