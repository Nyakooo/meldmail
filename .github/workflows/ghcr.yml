name: Publish GHCR image and release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish as a GitHub Release (leave blank to build an image)"
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.release_tag }}
      - uses: docker/setup-qemu-action@v4
        if: ${{ !inputs.release_tag }}
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        if: ${{ !inputs.release_tag }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/nyakooo/meldmail
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=long
            type=ref,event=tag
          labels: |
            io.meldmail.project=meldmail
            org.opencontainers.image.source=https://github.com/Nyakooo/meldmail
            org.opencontainers.image.licenses=Apache-2.0
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        if: ${{ !inputs.release_tag }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify existing tagged image
        if: ${{ inputs.release_tag }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Expected an existing v-prefixed release tag."
            exit 1
          fi
          docker buildx imagetools inspect "ghcr.io/nyakooo/meldmail:$RELEASE_TAG"

  release:
    if: ${{ inputs.release_tag || startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Expected a v-prefixed release tag."
            exit 1
          fi
          notes="releases/$RELEASE_TAG.md"
          if [[ ! -s "$notes" ]]; then
            echo "::error file=$notes::Add release notes before publishing $RELEASE_TAG."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json url --jq .url; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --verify-tag --notes-file "$notes"
          fi
